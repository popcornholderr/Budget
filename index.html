<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#0b0b0c;--mut:#86868b;--bg:#f5f5f7;--g:rgba(255,255,255,.55);--gb:rgba(255,255,255,.75);--ok:#2f9e63;--org:#e07b00;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:fl 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;background:#fff;top:-10vw;left:-8vw}
.bg i:nth-child(2){width:40vw;height:40vw;background:#dfe3ea;top:30vh;right:-10vw;animation-delay:-8s}
.bg i:nth-child(3){width:36vw;height:36vw;background:#e9e9ee;bottom:-12vw;left:20vw;animation-delay:-14s}
@keyframes fl{to{transform:translate(6vw,4vh) scale(1.12)}}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 130px}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);border-radius:28px;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4),0 12px 40px rgba(0,0,0,.06)}
h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.035em;font-weight:650;margin:6px 0 4px;line-height:1.05}
h2{font-size:20px;letter-spacing:-.02em;margin:0;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.btn{border:0;cursor:pointer;font:inherit;font-weight:550;padding:10px 18px;border-radius:99px;background:var(--ink);color:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.btn:hover{transform:scale(1.04)}.btn:active{transform:scale(.96)}
.btn.g{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--gb);backdrop-filter:blur(16px)}
.btn.s{padding:6px 12px;font-size:13px}.btn.r{color:var(--bad)}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
.card{padding:22px}
.big{font-size:32px;font-weight:650;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.bar{height:6px;border-radius:9px;background:rgba(0,0,0,.07);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--ink);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--org)}.bar i.bad{background:var(--bad)}
.events{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ev{position:relative;height:270px;border-radius:30px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#fff,#d9dce2);border:1px solid var(--gb);box-shadow:0 14px 40px rgba(0,0,0,.08);transition:transform .5s cubic-bezier(.2,.9,.3,1),filter .5s,opacity .5s}
.ev:hover{transform:translateY(-5px) scale(1.012)}
.ev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ev.done{filter:grayscale(1);opacity:.55}.ev.done .t{text-decoration:line-through}
.ev .in{position:absolute;left:10px;right:10px;bottom:10px;padding:14px 16px;border-radius:22px}
.ev .t{font-size:19px;font-weight:620;letter-spacing:-.02em}
.tick{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);background:rgba(255,255,255,.6);backdrop-filter:blur(14px);cursor:pointer;display:grid;place-items:center;font-size:16px;color:#fff;transition:.3s}
.tick.on{background:var(--ink);border-color:var(--ink)}
.hero{position:relative;height:clamp(200px,34vw,320px);border-radius:34px;overflow:hidden;background:linear-gradient(135deg,#fff,#d4d7de);border:1px solid var(--gb);box-shadow:0 20px 50px rgba(0,0,0,.09)}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .in{position:absolute;left:14px;right:14px;bottom:14px;padding:16px 20px;border-radius:24px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:14px 0;padding:22px}
.sum .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:550;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid var(--gb);white-space:nowrap}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.ok:before{background:var(--ok)}.pill.warn:before{background:var(--org)}.pill.bad:before{background:var(--bad)}
.tabs{display:inline-flex;padding:5px;border-radius:99px;margin:8px 0 16px;gap:2px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-weight:550;color:var(--mut);padding:8px 18px;border-radius:99px;cursor:pointer;transition:.35s cubic-bezier(.3,1.2,.5,1)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.b{margin-bottom:12px;padding:20px}
.it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06);cursor:pointer}
.grn{color:var(--ok)}.org{color:var(--org)}.red{color:var(--bad)}
.chk{display:flex;gap:12px;align-items:center;padding:13px 4px;border-top:1px solid rgba(0,0,0,.06)}
.chk .tick{position:static;flex:none;width:26px;height:26px;font-size:13px}
.chk.on span{color:var(--mut);text-decoration:line-through}
.chk .x{margin-left:auto;border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}
.in-t{font:inherit;font-size:16px;color:inherit;width:100%;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.7);border-radius:16px;padding:12px 14px;outline:none;transition:.2s}
.in-t:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.mos{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(80px,15vw,130px);grid-auto-flow:dense;gap:10px}
.mos div{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1);transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.mos div:hover{transform:scale(1.02)}
.mos img{width:100%;height:100%;object-fit:cover;display:block}
.mos div:nth-child(1){grid-column:span 3;grid-row:span 2}
.mos div:nth-child(2),.mos div:nth-child(3){grid-column:span 3}
.mos div:nth-child(4){grid-column:span 2;grid-row:span 2}
.mos div:nth-child(5){grid-column:span 4;grid-row:span 2}
.mos .rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);cursor:pointer;opacity:0;transition:.25s}
.mos div:hover .rm{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;padding:6px;gap:2px;border-radius:99px;max-width:calc(100% - 20px)}
.nav button{border:0;background:none;font:inherit;font-weight:550;color:var(--mut);padding:11px 20px;border-radius:99px;cursor:pointer;transition:.35s cubic-bezier(.3,1.2,.5,1)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(240,240,244,.5);backdrop-filter:blur(8px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fi .3s}
.sheet{width:min(460px,100%);max-height:calc(100% - 24px);overflow-y:auto;margin:12px;padding:24px;animation:up .55s cubic-bezier(.2,1.1,.3,1);background:rgba(255,255,255,.82)}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px}
.sheet .acts{display:flex;gap:8px;margin-top:22px}.sheet .acts .btn:first-child{flex:1}
@keyframes up{from{transform:translateY(60px) scale(.97);opacity:0}}
@keyframes fi{from{opacity:0}}
.view{animation:vw .6s cubic-bezier(.2,.9,.3,1)}
@keyframes vw{from{opacity:0;transform:translateY(14px) scale(.99);filter:blur(6px)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:12px 20px;z-index:30;font-weight:550}
html{-webkit-tap-highlight-color:transparent}button,label,.it,.ev{touch-action:manipulation}.top{flex-wrap:wrap}@media(hover:none){.mos .rm{opacity:1}.ev:hover,.btn:hover,.mos div:hover{transform:none}}@media(max-width:620px){.sum{grid-template-columns:1fr}.wrap{padding:20px 14px 130px}.nav button{padding:10px 9px;font-size:13px}.hero .in{left:10px;right:10px;bottom:10px;padding:12px 14px}.hero h2{font-size:21px!important}.big{font-size:28px}.card,.b{padding:16px}.events{grid-template-columns:1fr}.ev{height:240px}.btn.s{padding:8px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap" id="app"></div>
<div class="nav glass" id="nav"></div>
<script>
const uid=()=>Math.random().toString(36).slice(2,9),$=s=>document.querySelector(s);
function load(){try{const s=JSON.parse(localStorage.getItem('ledger-v2'));if(s)return s;const o=JSON.parse(localStorage.getItem('ledger-v1'));if(o){const n=Date.now();return{dep:o.sav&&o.sav.amt?[{id:uid(),title:'Opening balance',amt:+o.sav.amt,ts:n}]:[],lend:[],ev:o.ev.map(e=>({id:e.id,title:e.title,date:e.date,done:e.done,cover:e.cover,photos:e.photos,todo:e.todo,ts:n,doneTs:n,other:{planned:0,items:[]},bud:e.bud.map(b=>({id:b.id,title:b.title,planned:b.planned,per:b.per,ts:n,items:b.items}))}))}}}catch(e){}return{dep:[],lend:[],ev:[]}}
let S=load(),sec='events',view=null,tab='budget',btab='tx',ptab='buy';S.pur=S.pur||[];S.rm=S.rm||{};
const persist=()=>{try{localStorage.setItem('ledger-v2',JSON.stringify(S))}catch(e){toast('Storage is full — remove a photo')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>(n<0?'−':'')+'₹'+Math.round(Math.abs(n||0)).toLocaleString('en-IN');
const dt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function toast(m){const t=document.createElement('div');t.className='toast glass';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const sp=b=>sum(b.items.map(i=>i.price));
const over=e=>sum(e.bud.map(b=>Math.max(0,sp(b)-b.planned)));
const tot=e=>({p:sum(e.bud.map(b=>b.planned))+(+e.other.planned||0),s:sum(e.bud.map(sp))+sp(e.other)});
const st=(s,p)=>!p?(s?'bad':''):s<=p?'ok':s<=p*1.1?'warn':'bad';
const lbl={ok:'On track',warn:'Slightly over',bad:'Over budget','':'No budget set'};
const bar=(s,p,c)=>`<div class="bar"><i class="${c??st(s,p)}" data-w="${p?Math.min(100,s/p*100):0}"></i></div>`;
const evOf=()=>S.ev.find(e=>e.id===view);
function rows(){const r=[];
 S.dep.forEach(d=>r.push({key:'dep:'+d.id,f:d.f||'pf',ts:d.ts,t:d.title,a:d.amt,k:'dep'}));
 S.lend.forEach(p=>p.en.forEach(x=>{const l=p.dir==='lent',pr=x.k==='p';r.push({key:'len:'+x.id,f:x.f||'pf',ts:x.ts,k:p.dir,t:(l?(pr?'Lent to ':'Received from '):(pr?'Borrowed from ':'Paid back '))+p.who,a:(l===pr?-1:1)*x.amt})}));
 S.ev.forEach(e=>{const pl=tot(e).p;if(pl)r.push({key:'bud:'+e.id,f:e.fund||'pf',ts:e.ts,k:'bud',t:e.title,a:-pl});
  if(e.done){const t=tot(e),d=t.p-t.s;if(d)r.push({key:'set:'+e.id,f:e.fund||'pf',ts:e.doneTs,k:'bud',t:e.title+' settled',a:d})}});
 S.pur.forEach(p=>{if(p.done)r.push({key:'pur:'+p.id,f:p.fund||'pf',ts:p.doneTs||p.ts,k:'pur',t:p.title,a:-p.amt});else if(p.res&&p.est)r.push({key:'pur:'+p.id,f:p.fund||'pf',ts:p.ts,k:'pur',t:p.title+' (reserved)',a:-p.est})});
 return r.map(x=>S.rm[x.key]?{...x,a:x.a-S.rm[x.key]}:x).filter(x=>Math.abs(x.a)>.001).sort((a,b)=>b.ts-a.ts)}
const bal=f=>sum(rows().filter(r=>!f||r.f===f).map(r=>r.a));
function sheet(title,fields,onSave,onDel,dl){
  const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<div class="sheet glass"><h2>${title}</h2>${fields.map(f=>f.t==='note'?`<p class="sm mut" style="margin:12px 0 0">${f.l}</p>`:f.t==='sel'?`<label>${f.l}</label><select class="in-t" name="${f.n}">${f.o.map(([v,n])=>`<option value="${v}"${v===f.v?' selected':''}>${n}</option>`).join('')}</select>`:`<label>${f.l}</label><input class="in-t" name="${f.n}" type="${f.t||'text'}" value="${esc(f.v)}" placeholder="${esc(f.ph||'')}" ${f.t==='number'?'inputmode="decimal"':''}>`).join('')}<div class="acts"><button class="btn" data-s>Save</button>${onDel?`<button class="btn g r" data-d>${dl||'Delete'}</button>`:''}<button class="btn g" data-c>Cancel</button></div></div>`;
  document.body.appendChild(d);const x=()=>d.remove();if(!d.querySelector('input,select'))d.querySelector('[data-s]').remove();else d.querySelector('input,select').focus();
  d.onclick=ev=>{if(ev.target===d||ev.target.dataset.c!==undefined)x();
   if(ev.target.dataset.s!==undefined){const v={};d.querySelectorAll('input,select').forEach(i=>v[i.name]=i.value.trim());onSave(v);persist();x();render()}
   if(ev.target.dataset.d!==undefined){if(ev.target.dataset.sure){onDel();persist();x();render()}else{ev.target.dataset.sure=1;ev.target.textContent='Tap to confirm'}}};
  d.onkeydown=e=>{if(e.key==='Enter')d.querySelector('[data-s]').click();if(e.key==='Escape')x()};
}
function compress(f){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};im.src=u})}
function render(){
  $('#nav').innerHTML=[['events','Events'],['pur','Purchase'],['lent','Lent'],['borrowed','Borrowed'],['bank','Bank']].map(([k,n])=>`<button class="${sec===k?'on':''}" data-a="sec" data-id="${k}">${n}</button>`).join('');
  const a=$('#app');a.innerHTML=sec==='events'?(view&&evOf()?evPage():home()):sec==='bank'?bank():sec==='pur'?purch():people(sec);
  a.firstElementChild.classList.add('view');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%')));
}
function home(){
  const act=S.ev.filter(e=>!e.done),res=sum(act.map(e=>tot(e).p)),dn=sum(S.ev.filter(e=>e.done).map(e=>tot(e).s));
  return `<div><div class="top"><div><div class="mut">Your money, quietly arranged</div><h1>Events</h1></div><button class="btn" data-a="new-ev">New event</button></div>
  <div class="grid stats"><div class="card glass"><span class="mut">Spent on completed events</span><div class="big">${inr(dn)}</div></div><div class="card glass"><span class="mut">Estimated for active events</span><div class="big">${inr(res)}</div></div></div>
  ${S.ev.length?`<div class="grid events">${S.ev.map(e=>{const t=tot(e),tt=e.todo.length,td=e.todo.filter(x=>x.done).length;return `<div class="ev ${e.done?'done':''}" data-a="open" data-id="${e.id}">${e.cover?`<img src="${e.cover}" alt="">`:''}<div class="tick ${e.done?'on':''}" data-a="tick" data-id="${e.id}">${e.done?'✓':''}</div><div class="in glass"><div class="t">${esc(e.title)}</div><div class="sm mut">${esc(e.date)||'No date'} · ${inr(t.s)} of ${inr(t.p)}${tt?` · ${td}/${tt} done`:''}</div>${bar(t.s,t.p)}</div></div>`}).join('')}</div>`:`<div class="empty card glass">No events yet.<br>Create one for a trip, a purchase, or anything you’re planning.</div>`}</div>`;
}
function evPage(){
  const e=evOf(),t=tot(e),s=st(t.s,t.p),r=t.p?Math.min(1,t.s/t.p):0,C=2*Math.PI*34,left=t.p-t.s;
  return `<div><div class="top"><button class="btn g" data-a="back">‹ Back</button><div><button class="btn g" data-a="edit-ev">Edit</button> <label class="btn g" style="display:inline-block">Cover<input type="file" accept="image/*" data-f="cover" hidden></label></div></div>
  <div class="hero">${e.cover?`<img src="${e.cover}" alt="">`:''}<div class="in glass"><div><h2 style="font-size:26px">${esc(e.title)}</h2><div class="sm mut">${esc(e.date)||'No date'} · ${e.fund==='pm'?'Pocket money':'Personal fund'}</div></div><div class="tick ${e.done?'on':''}" style="position:static" data-a="tick" data-id="${e.id}">${e.done?'✓':''}</div></div></div>
  <div class="sum glass"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="7"/><circle cx="43" cy="43" r="34" fill="none" stroke="var(--${{ok:'ok',warn:'org',bad:'bad'}[s]||'mut'})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*r} ${C}" transform="rotate(-90 43 43)" style="transition:stroke-dasharray 1s"/><text x="43" y="48" text-anchor="middle" font-size="16" font-weight="650" fill="#0b0b0c">${t.p?Math.round(t.s/t.p*100):0}%</text></svg>
  <div><div class="row" style="margin-bottom:12px"><b>Summary</b><span class="pill ${s}">${lbl[s]}</span></div><div class="nums"><div><div class="sm mut">Taken from bank</div><b>${inr(t.p)}</b></div><div><div class="sm mut">Spent</div><b>${inr(t.s)}</b></div><div><div class="sm mut">${left<0?'Over by':'Left'}</div><b class="${left<0?'red':''}">${inr(Math.abs(left))}</b></div></div>
  <div class="sm mut" style="margin-top:10px">${e.done?'Settled with the bank.':'On checkout the leftover returns to the bank; any overspend is deducted.'}</div></div></div>
  <div class="tabs glass">${[['budget','Budget'],['todo','To-do'],['gal','Gallery']].map(([k,n])=>`<button class="${tab===k?'on':''}" data-a="tab" data-id="${k}">${n}</button>`).join('')}</div>
  ${{budget:bud,todo,gal}[tab](e)}</div>`;
}
function items(b,planned,bid){let run=0;
  return b.items.map(i=>{run+=+i.price||0;const p=+i.price||0,per=+b.per;
   const ov=run>planned,c=ov?'red':per?(p<per?'grn':p===per?'':p<2*per?'org':'red'):'';
   return `<div class="it" data-a="edit-i" data-b="${bid}" data-id="${i.id}"><span class="${ov?'red':''}">${esc(i.title)||'Entry'} <span class="sm mut">${esc(i.time)}</span></span><b class="${c}">${inr(p)}</b></div>`}).join('')}
function bud(e){
  const ov=over(e),o=e.other,eff=(+o.planned||0)-ov,os=sp(o),oc=st(os,eff);
  return `<div class="row" style="margin-bottom:12px"><span class="mut">Budgets are set aside from your bank.</span><button class="btn s" data-a="add-b">Add budget</button></div>`+
  e.bud.map(b=>{const s=sp(b),c=st(s,+b.planned);return `<div class="b glass"><div class="row"><div><b style="font-size:17px">${esc(b.title)}</b><div class="sm mut">${inr(s)} of ${inr(b.planned)}${+b.per?` · ${inr(b.per)} per entry`:''}</div></div><span class="pill ${c}">${lbl[c]}</span></div>${bar(s,+b.planned)}${items(b,+b.planned,b.id)}<div class="row" style="margin-top:12px"><button class="btn g s" data-a="add-i" data-b="${b.id}">Add entry</button><button class="btn g s" data-a="edit-b" data-id="${b.id}">Edit</button></div></div>`}).join('')+
  `<div class="b glass"><div class="row"><div><b style="font-size:17px">Other spends</b><div class="sm mut">${inr(eff-os)} left of ${inr(eff)}${ov?` · ${inr(ov)} absorbed from overspends`:''}</div></div><span class="pill ${oc}">${lbl[oc]}</span></div>${bar(os,eff)}${items(o,eff,'o')}<div class="row" style="margin-top:12px"><button class="btn g s" data-a="add-i" data-b="o">Add entry</button><button class="btn g s" data-a="edit-o">Edit estimate</button></div></div>`;
}
function todo(e){
  return `<div class="card glass"><div class="row" style="gap:8px"><input class="in-t" id="tin" placeholder="Add a task and press Enter"><button class="btn" data-a="add-t">Add</button></div>
  ${e.todo.map(x=>`<div class="chk ${x.done?'on':''}"><div class="tick ${x.done?'on':''}" data-a="tog-t" data-id="${x.id}">${x.done?'✓':''}</div><span>${esc(x.text)}</span><button class="x" data-a="del-t" data-id="${x.id}">×</button></div>`).join('')}</div>`;
}
function gal(e){
  return `<div class="row" style="margin-bottom:12px"><span class="mut">${e.photos.length} of 5 photos</span>${e.photos.length<5?`<label class="btn s">Add photos<input type="file" accept="image/*" multiple data-f="photos" hidden></label>`:''}</div>`+
  (e.photos.length?`<div class="mos">${e.photos.map((p,i)=>`<div><img src="${p}" alt=""><button class="rm" data-a="rm-p" data-id="${i}">×</button></div>`).join('')}</div>`:'<div class="empty card glass">Add up to five photos. They’ll be arranged as a collage.</div>');
}
function people(dir){
  const L=S.lend.filter(p=>p.dir===dir),lent=dir==='lent';
  const pt=p=>({t:sum(p.en.filter(x=>x.k==='p').map(x=>x.amt)),r:sum(p.en.filter(x=>x.k==='r').map(x=>x.amt))});
  const open=sum(L.map(p=>{const q=pt(p);return q.t-q.r}));
  return `<div><div class="top"><div><div class="mut">${lent?'Money others owe you':'Money you owe others'}</div><h1>${lent?'Lent':'Borrowed'}</h1></div><button class="btn" data-a="new-p">${lent?'Lend to someone':'Borrow from someone'}</button></div>
  <div class="card glass" style="margin-bottom:14px"><span class="mut">${lent?'Yet to receive':'Yet to pay back'}</span><div class="big">${inr(open)}</div></div>
  ${L.map(p=>{const q=pt(p),rem=q.t-q.r;return `<div class="b glass"><div class="row"><div><b style="font-size:18px">${esc(p.who)}</b><div class="sm mut">${inr(q.r)} ${lent?'received':'paid back'} of ${inr(q.t)}</div></div><span class="pill ${rem<=0?'ok':''}">${rem<=0?'Settled':inr(rem)+' left'}</span></div>${bar(q.r,q.t,rem<=0?'ok':'')}
  ${p.en.map(x=>`<div class="it" data-a="edit-en" data-p="${p.id}" data-id="${x.id}"><span>${x.k==='p'?(lent?'Lent':'Borrowed'):(lent?'Received':'Paid back')} <span class="sm mut">${dt(x.ts)} ${esc(x.note)}</span></span><b>${inr(x.amt)}</b></div>`).join('')}
  <div class="row" style="margin-top:12px"><div><button class="btn g s" data-a="p-add" data-id="${p.id}" data-k="p">${lent?'Lend more':'Borrow more'}</button> <button class="btn g s" data-a="p-add" data-id="${p.id}" data-k="r">${lent?'Received':'Paid back'}</button></div><button class="btn g s" data-a="edit-p" data-id="${p.id}">Edit</button></div></div>`}).join('')||`<div class="empty card glass">Nobody here yet.</div>`}</div>`;
}
function purch(){
  const P=S.pur,bo=P.filter(p=>p.done).sort((a,b)=>(b.doneTs||b.ts)-(a.doneTs||a.ts)),pl=P.filter(p=>!p.done).sort((a,b)=>b.ts-a.ts),bs=sum(bo.map(p=>p.amt)),es=sum(pl.map(p=>p.est)),fl=p=>p.fund==='pm'?'Pocket money':'Personal fund';
  return `<div><div class="top"><div><div class="mut">Everything you buy</div><h1>Purchase</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" data-a="add-pu" data-k="plan">Plan</button><button class="btn" data-a="add-pu" data-k="buy">Add purchase</button></div></div>
  <div class="grid stats"><div class="card glass"><span class="mut">Spent</span><div class="big">${inr(bs)}</div></div><div class="card glass"><span class="mut">Planned</span><div class="big">${inr(es)}</div></div></div>
  ${pl.length?`<div class="card glass" style="margin-bottom:14px"><b>Planned</b> <span class="sm mut">· pinned</span>${pl.map(p=>`<div class="chk"><div class="tick" data-a="done-pu" data-id="${p.id}"></div><span>${esc(p.title)} <span class="sm mut">${p.res?'reserved':'taken when bought'} · ${fl(p)}</span></span><b style="margin-left:auto;cursor:pointer" data-a="edit-pu" data-id="${p.id}">${inr(p.est)}</b></div>`).join('')}</div>`:''}
  <div class="card glass"><b>Bought</b>${bo.map(p=>`<div class="it" data-a="edit-pu" data-id="${p.id}"><span>${esc(p.title)} <span class="sm mut">${dt(p.doneTs||p.ts)} · ${fl(p)}${p.est?' · est '+inr(p.est):''}</span></span><b>${inr(p.amt)}</b></div>`).join('')||'<div class="empty">No purchases yet.</div>'}</div></div>`;
}
function bank(){
  const R=rows().filter(r=>r.k!=='dep'),tn={bud:'Budget',lent:'Lent',borrowed:'Borrowed',pur:'Purchase'},fn={pf:'Personal',pm:'Pocket'};
  return `<div><div class="top"><div><div class="mut">Everything you hold</div><h1>Bank</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn g r" data-a="clear-bank">Clear bank</button><button class="btn" data-a="add-dep">Add money</button></div></div>
  <div class="grid" style="grid-template-columns:1fr 1fr">${[['pf','Personal fund'],['pm','Pocket money']].map(([k,n])=>`<div class="card glass"><span class="mut">${n}</span><div class="big ${k==='pm'?'grn':bal(k)<0?'red':''}" style="font-size:clamp(22px,6.4vw,38px)">${inr(bal(k))}</div></div>`).join('')}</div><div class="sm mut" style="margin:10px 6px 0">Total ${inr(bal())}</div>
  <div class="tabs glass" style="margin-top:14px">${[['tx','Transaction history'],['dep','Entry history']].map(([k,n])=>`<button class="${btab===k?'on':''}" data-a="btab" data-id="${k}">${n}</button>`).join('')}</div>
  <div class="card glass">${btab==='tx'?(R.map(r=>`<div class="it" data-a="del-tx" data-id="${r.key}"><span>${esc(r.t)} <span class="sm mut">${tn[r.k]} · ${fn[r.f]} · ${dt(r.ts)}</span></span><b class="${r.a<0?'':'grn'}">${r.a>0?'+':''}${inr(r.a)}</b></div>`).join('')||'<div class="empty">Budgets, lending and borrowing show up here.</div>'):
  (S.dep.slice().sort((a,b)=>b.ts-a.ts).map(d=>`<div class="it" data-a="edit-dep" data-id="${d.id}"><span>${esc(d.title)} <span class="sm mut">${d.f==='pm'?'Pocket':'Personal'} · ${dt(d.ts)}</span></span><b class="grn">+${inr(d.amt)}</b></div>`).join('')||'<div class="empty">Add money to start your balance.</div>')}</div>
  <div class="card glass" style="margin-top:14px"><b>Backup</b><div class="sm mut" style="margin:4px 0 14px">Your data lives only in this browser. Save a backup file now and then, and restore it if anything is wiped or you switch phones.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" data-a="export">Export backup</button><label class="btn g s">Import backup<input type="file" accept=".json,application/json" data-f="import" hidden></label></div></div></div>`;
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;ev.stopPropagation();
  const a=el.dataset.a,id=el.dataset.id,e=evOf(),F=(n,l,v,t,ph)=>({n,l,v,t,ph}),FD=(v,l,u)=>({n:'f',l:l||'Fund',t:'sel',v:v||'pf',o:[['pf',u?'Use personal fund':'Personal fund'],['pm',u?'Use pocket money':'Pocket money']]});
  const B=x=>x==='o'?e.other:e.bud.find(q=>q.id===x),b=e&&B(el.dataset.b||id),P=S.lend.find(q=>q.id===id||q.id===el.dataset.p);
  if(a==='sec'){sec=id;view=null;render();scrollTo(0,0)}
  else if(a==='new-ev')sheet('New event',[F('title','Title','','text','Mumbai trip'),F('date','Date','','date'),FD('pf','Pay budget from',1)],v=>{S.ev.unshift({id:uid(),title:v.title||'Untitled',date:v.date,fund:v.f,done:false,cover:'',photos:[],bud:[],todo:[],ts:Date.now(),other:{planned:0,items:[]}})});
  else if(a==='open'){view=id;tab='budget';render();scrollTo(0,0)}
  else if(a==='back'){view=null;render()}
  else if(a==='tick'){const x=S.ev.find(q=>q.id===id);x.done=!x.done;x.doneTs=Date.now();persist();render()}
  else if(a==='edit-ev')sheet('Edit event',[F('title','Title',e.title),F('date','Date',e.date,'date'),FD(e.fund,'Pay budget from',1)],v=>{e.title=v.title||e.title;e.date=v.date;e.fund=v.f},()=>{S.ev=S.ev.filter(q=>q!==e);view=null});
  else if(a==='tab'){tab=id;render()}
  else if(a==='add-b')sheet('New budget',[F('title','Title','','text','Food'),F('planned','Estimated amount','','number','3000'),F('per','Estimate per entry (optional)','','number','250')],v=>{e.bud.push({id:uid(),title:v.title||'Budget',planned:+v.planned||0,per:+v.per||0,ts:Date.now(),items:[]})});
  else if(a==='edit-b')sheet('Edit budget',[F('title','Title',b.title),F('planned','Estimated amount',b.planned,'number'),F('per','Estimate per entry',b.per||'','number')],v=>{b.title=v.title||b.title;b.planned=+v.planned||0;b.per=+v.per||0},()=>{e.bud=e.bud.filter(q=>q!==b)});
  else if(a==='edit-o')sheet('Other spends',[F('planned','Estimated amount',e.other.planned||'','number','2000')],v=>{e.other.planned=+v.planned||0;e.other.ts=Date.now()});
  else if(a==='add-i')sheet('New entry',[F('title','Title (optional)','','text','Lunch'),F('price','Price','','number'),F('time','Time (optional)','','time')],v=>{b.items.push({id:uid(),title:v.title,price:+v.price||0,time:v.time})});
  else if(a==='edit-i'){const i=b.items.find(q=>q.id===id);sheet('Edit entry',[F('title','Title',i.title),F('price','Price',i.price,'number'),F('time','Time',i.time,'time')],v=>{i.title=v.title;i.price=+v.price||0;i.time=v.time},()=>{b.items=b.items.filter(q=>q!==i)})}
  else if(a==='add-t'){const i=$('#tin');if(i.value.trim()){e.todo.push({id:uid(),text:i.value.trim(),done:false});persist();render();$('#tin').focus()}}
  else if(a==='tog-t'){const t=e.todo.find(q=>q.id===id);t.done=!t.done;persist();render()}
  else if(a==='del-t'){e.todo=e.todo.filter(q=>q.id!==id);persist();render()}
  else if(a==='rm-p'){e.photos.splice(+id,1);persist();render()}
  else if(a==='new-p')sheet(sec==='lent'?'Lend to someone':'Borrow from someone',[F('who','Name','','text','Vihar'),F('amt','Amount','','number','300'),F('note','Note (optional)'),FD('pf',sec==='lent'?'Take money from':'Add money to',sec==='lent')],v=>{S.lend.push({id:uid(),dir:sec,who:v.who||'Someone',en:[{id:uid(),k:'p',amt:+v.amt||0,note:v.note,f:v.f,ts:Date.now()}]})});
  else if(a==='p-add'){const k=el.dataset.k,l=P.dir==='lent';sheet(k==='p'?(l?'Lend more':'Borrow more'):(l?'Money received':'Money paid back'),[F('amt','Amount','','number'),F('note','Note (optional)'),FD(P.en[0].f,'Fund')],v=>{P.en.push({id:uid(),k,amt:+v.amt||0,note:v.note,f:v.f,ts:Date.now()})})}
  else if(a==='edit-p')sheet('Edit person',[F('who','Name',P.who)],v=>{P.who=v.who||P.who},()=>{S.lend=S.lend.filter(q=>q!==P)});
  else if(a==='edit-en'){const x=P.en.find(q=>q.id===id);sheet('Edit entry',[F('amt','Amount',x.amt,'number'),F('note','Note',x.note),FD(x.f,'Fund')],v=>{x.amt=+v.amt||0;x.note=v.note;x.f=v.f},()=>{P.en=P.en.filter(q=>q!==x);if(!P.en.length)S.lend=S.lend.filter(q=>q!==P)})}
  else if(a==='export')(async()=>{const j=JSON.stringify(S),nm='ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:nm,data:j});toast('Backup saved');return}}catch(x){if(x&&x.code==='declined')return}try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download=nm;document.body.appendChild(l);l.click();l.remove();toast('Backup saved')}catch(x){sheet('Copy your backup',[F('j','Select all, copy, and keep it somewhere safe',j)],()=>{})}})();
  else if(a==='btab'){btab=id;render()}
  else if(a==='add-pu'){const now=Date.now(),R={n:'res',l:'When to take the money',t:'sel',v:'0',o:[['0','When I mark it bought'],['1','Right now (reserve it)']]};if(el.dataset.k==='buy')sheet('Add purchase',[F('title','What did you buy?','','text','Headphones'),F('amt','Amount spent','','number'),FD('pf','Pay from',1)],v=>{S.pur.push({id:uid(),title:v.title||'Purchase',done:true,amt:+v.amt||0,est:0,res:false,fund:v.f,ts:now,doneTs:now})});else sheet('Plan a purchase',[F('title','What do you want to buy?','','text','Sneakers'),F('est','Estimated amount','','number'),FD('pf','Pay from',1),R],v=>{S.pur.push({id:uid(),title:v.title||'Purchase',done:false,amt:0,est:+v.est||0,res:v.res==='1',fund:v.f,ts:now})})}
  else if(a==='done-pu'){const p=S.pur.find(q=>q.id===id);sheet('Mark as bought',[F('amt','Amount actually spent',p.est,'number'),FD(p.fund,'Pay from',1)],v=>{p.done=true;p.amt=+v.amt||0;p.fund=v.f;p.doneTs=Date.now()})}
  else if(a==='edit-pu'){const p=S.pur.find(q=>q.id===id),del=()=>{S.pur=S.pur.filter(q=>q!==p)};if(p.done)sheet('Edit purchase',[F('title','Title',p.title),F('amt','Amount spent',p.amt,'number'),FD(p.fund,'Pay from',1)],v=>{p.title=v.title||p.title;p.amt=+v.amt||0;p.fund=v.f},del);else sheet('Edit planned purchase',[F('title','Title',p.title),F('est','Estimated amount',p.est,'number'),FD(p.fund,'Pay from',1),{n:'res',l:'When to take the money',t:'sel',v:p.res?'1':'0',o:[['0','When I mark it bought'],['1','Right now (reserve it)']]}],v=>{p.title=v.title||p.title;p.est=+v.est||0;p.fund=v.f;p.res=v.res==='1'},del)}
  else if(a==='del-tx'){const r=rows().find(q=>q.key===id);if(r)sheet('Remove transaction',[{n:'n',t:'note',l:esc(r.t)+' \u00b7 '+inr(r.a)+'. Removing it takes it out of your bank balance and history. The original event, lending or purchase stays.'}],null,()=>{S.rm[id]=(S.rm[id]||0)+r.a},'Remove')}
  else if(a==='clear-bank')sheet('Clear bank',[{n:'n',t:'note',l:'This deletes every entry and transaction in the bank and sets the balance to \u20b90. Your events, lending and purchases stay as they are.'}],null,()=>{S.dep=[];rows().forEach(r=>{S.rm[r.key]=(S.rm[r.key]||0)+r.a})},'Clear everything')
  else if(a==='add-dep')sheet('Add money',[F('title','Title','','text','Salary'),F('amt','Amount','','number'),FD('pf','Add to')],v=>{S.dep.push({id:uid(),title:v.title||'Deposit',amt:+v.amt||0,f:v.f,ts:Date.now()})});
  else if(a==='edit-dep'){const d=S.dep.find(q=>q.id===id);sheet('Edit deposit',[F('title','Title',d.title),F('amt','Amount',d.amt,'number'),FD(d.f,'Add to')],v=>{d.title=v.title||d.title;d.amt=+v.amt||0;d.f=v.f},()=>{S.dep=S.dep.filter(q=>q!==d)})}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tin')document.querySelector('[data-a="add-t"]').click()});
document.addEventListener('change',async ev=>{
  const f=ev.target.dataset.f;if(!f)return;const e=evOf();
  if(f==='import'){const file=ev.target.files[0];ev.target.value='';if(!file)return;let d;try{d=JSON.parse(await file.text());if(!Array.isArray(d.ev)||!Array.isArray(d.dep)||!Array.isArray(d.lend))throw 0}catch(x){return toast('That file isn’t a valid backup')}
   sheet('Restore backup',[{n:'n',l:'This replaces everything on this device. Tap Save to continue.',v:''}],()=>{S=d;S.pur=S.pur||[];S.rm=S.rm||{};view=null;sec='bank';toast('Backup restored')});return}
  if(f==='cover'&&ev.target.files[0])e.cover=await compress(ev.target.files[0]);
  if(f==='photos')for(const p of [...ev.target.files].slice(0,5-e.photos.length))e.photos.push(await compress(p));
  persist();render();
});
render();
</script></body></html>
